# The IT firm's client review pack, asked for by someone who is not the approver. A fictional firm, with job titles for people. The people's words and file are scripted, and everything Foundry says back is real.
# The Engineering Director asks, the Delivery Manager approves, so the brief and the final card come to the Delivery Manager's projects room and the due card goes to the Engineering Director.
# {in:N} says the clock time N minutes after the scene began, because there is no fake clock.
# Team Lead A answers by chat, Team Lead B sends a file from scripts/scenes/data, and Team Lead C goes quiet, gets one reminder, answers it with a lone "yes", and is still quiet at the due time.
# Start the desk with FOUNDRY_QUIET_SECONDS=8. The scene's people are made with: uv run --env-file .env python scripts/demo_people.py ensure it_firm_review
name: it_firm_review
brand: demo-it-firm
people:
  Engineering Director: [morpankh-delivery]
  Delivery Manager: [morpankh-delivery, morpankh-delivery-projects, morpankh-team-a-projects, morpankh-team-b-projects, morpankh-team-c-projects]
  Team Lead A: [morpankh-team-a]
  Team Lead B: [morpankh-team-b]
  Team Lead C: [morpankh-team-c]
watch: [morpankh-delivery, morpankh-team-a, morpankh-team-b, morpankh-team-c, morpankh-delivery-projects]
steps:
  # The manager's late ask. It is a voice note when there is a Sarvam key. Without one the same words are typed, and the timeline says so.
  - as: Engineering Director
    room: morpankh-delivery
    voice: "Harsingar Stores ka release review kal hai. Mujhe ek deck aur ek graphic chahiye, open defects by severity ka. Team Lead A, B aur C se unke team ke numbers chahiye."
    say: "Tomorrow's Harsingar Stores release review needs a deck and a one-page graphic of open defects by severity, ready by {in:50}. Team Lead A owes Team A's stories closed this sprint and defects open, Team Lead B owes Team B's open defects by severity as a table, and Team Lead C owes Team C's regression pass rate. Each by {in:8}."
    wait_for: {room: morpankh-delivery-projects, button: Approve, timeout: 300}
  - as: Delivery Manager
    room: morpankh-delivery-projects
    press: Approve
    wait_for: {room: morpankh-team-a, text: "Exact measure", timeout: 120}
  - as: Team Lead A
    room: morpankh-team-a
    say: "Team A closed 41 stories this sprint and has 3 defects open."
    wait_for: {text: "Got it", timeout: 180}
  - as: Team Lead B
    room: morpankh-team-b
    wait_for: {text: "Exact measure", timeout: 120}
  - as: Team Lead B
    room: morpankh-team-b
    file: data/team-b-open-defects-by-severity.csv
    say: "Here is Team B's table."
    wait_for: {text: "Got it", timeout: 180}
  # Team Lead C's one reminder, halfway to the due time, and then a lone word.
  - as: Team Lead C
    room: morpankh-team-c
    wait_for: {button: "Can't today", timeout: 720}
  - as: Team Lead C
    room: morpankh-team-c
    say: "yes"
    wait_for: {text: "Still waiting on", timeout: 120}
  # The due card goes to the asker, and lists Team Lead C's silence.
  - as: Engineering Director
    room: morpankh-delivery
    wait_for: {button: "Go without", timeout: 900}
  - as: Engineering Director
    room: morpankh-delivery
    press: "Go without"
    # The sign-off card by its title, because a maker's stuck card has an Approve button too.
    wait_for: {room: morpankh-delivery-projects, button: Approve, text: "Final work:", timeout: 2700}
  - as: Delivery Manager
    room: morpankh-delivery-projects
    press: Approve
    wait_for: {room: morpankh-delivery, text: "Here is your final work", timeout: 180}
