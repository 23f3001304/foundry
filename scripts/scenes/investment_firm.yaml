# The investment firm's quarterly review deck. A fictional firm, with job titles for people and made-up figures. The offices' words and files are scripted, and everything Foundry says back is real.
# {in:N} says the clock time N minutes after the scene began, because there is no fake clock.
# Four offices answer by chat and one by a file, from scripts/scenes/data. Office E's figure is far from the other four, and the final card is meant to name it.
# Start the desk with FOUNDRY_QUIET_SECONDS=8. The desk, and the makers' tools that setup_makers.py wrote, need the same FOUNDRY_INPUTS_DIR, or a maker cannot open the file.
name: investment_firm
brand: demo-investment-firm
people:
  # The approver works inside, so each room's cards for them come up in that room's projects room.
  Analyst Lead: [analysts, analysts-projects, office-a-projects, office-b-projects, office-c-projects, office-d-projects, office-e-projects]
  Office Head A: [office-a]
  Office Head B: [office-b]
  Office Head C: [office-c]
  Office Head D: [office-d]
  Office Head E: [office-e]
watch: [analysts, office-a, office-b, office-c, office-d, office-e, analysts-projects]
# What people said before the scene, so the brief's card can say when each last wrote. Written by scripts/seed_history.py and marked as seeded in the log.
history:
  - {as: Office Head A, room: office-a, days_ago: 1, say: "Office A has closed its books for the month."}
  - {as: Office Head B, room: office-b, days_ago: 2, say: "Office B has filed its regional report."}
  - {as: Office Head C, room: office-c, days_ago: 6, say: "Office C is waiting on custody statements."}
  - {as: Office Head D, room: office-d, days_ago: 21, say: "Office D has moved to a new floor."}
  - {as: Office Head E, room: office-e, days_ago: 3, say: "Office E has a client review this week."}
steps:
  # The request, and the brief's card with who owes what. The deck is asked to chart each office and the year, so the makers have to use the data tools.
  - as: Analyst Lead
    room: analysts
    say: "I need the quarterly review deck for the partners' meeting by {in:60}. Office Heads A, B, C, D and E each owe me their office's assets under management at the end of Q2 FY27, in USD millions, by {in:15}. I want a chart of the five offices, and a chart of how assets have moved over the past year."
    wait_for: {button: Approve, timeout: 300}
  - as: Analyst Lead
    room: analysts
    press: Approve
  # Each office is asked in its own room. A step waits for the ask before the answer, because an answer sent before it is in the room is only a message.
  - as: Office Head A
    room: office-a
    wait_for: {text: "Exact measure", timeout: 180}
  - as: Office Head A
    room: office-a
    say: "Office A ends the quarter with 6,420 in assets under management, in USD millions."
    wait_for: {text: "Got it", timeout: 180}
  - as: Office Head B
    room: office-b
    wait_for: {text: "Exact measure", timeout: 180}
  - as: Office Head B
    room: office-b
    say: "Office B ends the quarter with 5,180 in assets under management, in USD millions."
    wait_for: {text: "Got it", timeout: 180}
  # Office C sends a file, with no words beside it. Its asset classes add up to its figure, and the makers' tools open the file by its name.
  - as: Office Head C
    room: office-c
    wait_for: {text: "Exact measure", timeout: 180}
  - as: Office Head C
    room: office-c
    file: data/office-c-q2-fy27.csv
    wait_for: {text: "I saved", timeout: 180}
  - as: Office Head D
    room: office-d
    wait_for: {text: "Exact measure", timeout: 180}
  - as: Office Head D
    room: office-d
    say: "Office D ends the quarter with 7,050 in assets under management, in USD millions."
    wait_for: {text: "Got it", timeout: 180}
  # Office E's figure is more than three times what it gave last quarter and far from the other offices. Code judges that, and nothing else changes.
  - as: Office Head E
    room: office-e
    wait_for: {text: "Exact measure", timeout: 180}
  - as: Office Head E
    room: office-e
    say: "Office E ends the quarter with 19,800 in assets under management, in USD millions."
    wait_for: {text: "Got it", timeout: 180}
  # Every office has answered, so the makers start. The deck's charts are worked out by code, and the reviewer checks the deck. The final card is meant to name Office E's figure.
  - as: Analyst Lead
    room: analysts
    wait_for: {text: "far from the others", timeout: 2700}
  - as: Analyst Lead
    room: analysts
    press: Approve
    timeout: 180
    wait_for: {text: "Here is your final work", timeout: 180}
