# The IT firm's release status deck. A fictional firm, with job titles for people. The team's words are scripted, and everything Foundry says back is real.
# {in:N} says the clock time N minutes after the scene began, because there is no fake clock.
# Start the desk with FOUNDRY_QUIET_SECONDS=8 and FOUNDRY_SET_TIMES at two times after the scene should have reached its sign-off, such as 25 and 28 minutes after it starts.
name: it_firm
brand: demo-it-firm
people:
  # The approver works inside, so each room's cards for them come up in that room's projects room.
  Delivery Manager: [delivery, delivery-projects, team-a-projects, team-b-projects, team-c-projects]
  Team Lead A: [team-a]
  Team Lead B: [team-b]
  Team Lead C: [team-c]
watch: [delivery, team-a, team-b, team-c, delivery-projects]
# What people said before the scene, so the card can say when each last wrote. Written by scripts/seed_history.py and marked as seeded in the log.
history:
  - {as: Team Lead A, room: team-a, days_ago: 1, say: "Team A has the customer portal build in QA."}
  - {as: Team Lead B, room: team-b, days_ago: 3, say: "Team B moved the payment fixes to QA."}
  - {as: Team Lead C, room: team-c, days_ago: 21, say: "Team C has the reporting module in UAT."}
steps:
  # A Team Lead's daily note. The design has this as a Hinglish voice note, which needs Sarvam, so without a key the same words are typed and the voice step says it was skipped.
  - as: Team Lead A
    room: team-a
    voice: "aaj Team A ne customer portal ke login defects fix kar diye, kal QA wale retest karenge"
    wait_for: {text: "in today's report", timeout: 180}
  - as: Team Lead A
    room: team-a
    say: "aaj Team A ne customer portal ke login defects fix kar diye, kal QA wale retest karenge"
    wait_for: {text: "in today's report", timeout: 180}
  # The request, and the brief's card with who owes what.
  - as: Delivery Manager
    room: delivery
    say: "I need the release status deck for the client by {in:60}. Team Leads A, B and C each owe me their team's stories closed this sprint and defects open by {in:12}."
    wait_for: {button: Approve, timeout: 300}
  - as: Delivery Manager
    room: delivery
    press: Approve
    wait_for: {room: team-a, text: "Exact measure", timeout: 120}
  # Team Lead A answers. Team Lead B gives a reason. Team Lead C says nothing.
  - as: Team Lead A
    room: team-a
    say: "Team A closed 41 stories this sprint and has 3 defects open."
    wait_for: {text: "Got it", timeout: 180}
  - as: Team Lead B
    room: team-b
    say: "blocked on QA"
    wait_for: {text: "Noted", timeout: 180}
  # Anyone in the bucket's rooms can ask where it stands.
  - as: Team Lead A
    room: team-a
    say: "where's the deck?"
    wait_for: {text: "no reply to Foundry yet", timeout: 180}
  # Team Lead C's one reminder, halfway to the due time.
  - as: Team Lead C
    room: team-c
    wait_for: {button: "Can't today", timeout: 720}
  # The due card lists Team Lead B's reason and Team Lead C's silence.
  - as: Delivery Manager
    room: delivery
    wait_for: {button: "Go without", timeout: 900}
  - as: Delivery Manager
    room: delivery
    press: "Go without"
    wait_for: {button: Approve, timeout: 2700}
  # The makers made it and the reviewer passed it. The Delivery Manager signs off.
  - as: Delivery Manager
    room: delivery
    press: Approve
    wait_for: {text: "Here is your final work", timeout: 180}
  # The set times: one routine card with the day's report on it.
  - as: Delivery Manager
    room: delivery-projects
    wait_for: {button: "Approve everything clean", timeout: 1800}
  - as: Delivery Manager
    room: delivery-projects
    press: "Approve everything clean"
    wait_for: {text: "Report for", timeout: 180}
