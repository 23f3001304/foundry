<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} - Foundry</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="{{ 'shell' if user else 'bare' }}">
<a class="skip" href="#main">Skip to the page</a>
<header class="bar">
  <div class="bar-inner">
  <a class="mark" href="/">Foundry</a>
  {% if user %}
  <nav aria-label="Pages">
    <a href="/"{% if page == "overview" %} aria-current="page"{% endif %}>Overview</a>
    <a href="/jobs"{% if page == "jobs" %} aria-current="page"{% endif %}>Jobs</a>
    <a href="/work"{% if page == "work" %} aria-current="page"{% endif %}>Generated work</a>
    <a href="/responses"{% if page == "responses" %} aria-current="page"{% endif %}>Responses</a>
    <a href="/log"{% if page == "log" %} aria-current="page"{% endif %}>Action log</a>
  </nav>
  <form class="who" method="post" action="/logout">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <span>{{ user.login }}</span>
    <button class="quiet" type="submit">Sign out</button>
  </form>
  {% endif %}
  </div>
</header>
<main id="main">
{% block main %}{% endblock %}
</main>
</body>
</html>
