{% extends "base.html" %}
{% from "_ui.html" import sprite %}
{% block main %}
<div class="sign-in-stage">
  <div class="sign-in-art">
    {{ shapes.grid_tile("lime") }}
    {{ sprite("wave", 96, plays=True) }}
  </div>
  <div class="sign-in">
    <h1>Sign in</h1>
    <p class="lead">Use your Switch login. Foundry passes your password to Switch and doesn't keep it.</p>
    {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
    <form class="stack" method="post" action="/login">
      <div class="field">
        <label for="login">Login</label>
        <input id="login" name="login" type="text" autocomplete="username" autocapitalize="none" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="primary button-wide" type="submit">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
