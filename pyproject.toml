[project]
name = "foundry"
version = "0.1.0"
description = "Turns messy chat requests into approved, on-brand work through Switch rooms."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
