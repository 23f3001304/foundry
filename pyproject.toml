[project]
name = "foundry"
version = "0.1.0"
description = "Turns messy chat requests into approved, on-brand work through Switch rooms."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "python-multipart>=0.0.33",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
